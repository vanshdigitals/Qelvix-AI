name: CI

on:
  pull_request:
  push:
    branches: [main]

# Gates G1–G7 per 08 §12.1. Each gate is its own job and blocks merge
# independently; none is skippable via a commit message or a label.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  # Non-secret local values so the app's settings validate in CI (03 §11).
  NVIDIA_API_KEY: ci-not-a-real-key
  DATABASE_URL: postgresql+asyncpg://qelvix:qelvix@localhost:5432/qelvix
  SUPABASE_URL: http://localhost:54321
  SUPABASE_SERVICE_KEY: ci-not-a-real-key
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: ci-not-a-real-key
  FRONTEND_URL: http://localhost:3000
  ENVIRONMENT: development

jobs:
  g1-lint-typecheck:
    name: G1 · Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: ruff
        run: ruff check app tests && ruff format --check app tests
        working-directory: backend
      - name: mypy (strict)
        run: mypy app
        working-directory: backend
      - name: eslint
        run: npm run lint
        working-directory: frontend
      - name: tsc --noEmit
        run: npm run typecheck
        working-directory: frontend
      - name: prettier
        run: npm run format:check
        working-directory: frontend
      - name: AGENTS.md line ceiling
        run: bash scripts/check_agents_md_length.sh

  g2-unit-tests:
    name: G2 · Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qelvix
          POSTGRES_PASSWORD: qelvix
          POSTGRES_DB: qelvix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qelvix" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: pytest
        run: pytest
        working-directory: backend
      - name: vitest
        run: npm run test
        working-directory: frontend

  g3-accessibility:
    name: G3 · Accessibility (axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test tests/e2e/a11y.spec.ts
        working-directory: frontend

  g4-e2e:
    name: G4 · Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test tests/e2e/smoke.spec.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  g5-performance:
    name: G5 · Performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx --yes @lhci/cli@0.14.x autorun --config=../lighthouserc.json

  g6-contract:
    name: G6 · Contract snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install -r backend/requirements.txt
      - name: Regenerate snapshot and types
        run: |
          python scripts/export_openapi.py
          bash scripts/generate_types.sh
      - name: Fail if the committed snapshot drifted
        run: |
          git diff --exit-code -- \
            docs/contracts/openapi.json \
            frontend/lib/api/types.generated.ts

  g7-supply-chain:
    name: G7 · Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - name: detect-secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: frontend
