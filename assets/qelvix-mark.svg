<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="qelvix-grad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bg-grad)" stroke="url(#qelvix-grad)" stroke-width="2.5"/>

  <!-- Geometric Q Outer Loop (Shield / Radar Arc) -->
  <path d="M 60 26 
           C 40 26 26 40 26 60 
           C 26 80 40 94 60 94 
           C 71 94 81 89 88 81 
           L 78 72 
           C 73 77 67 80 60 80 
           C 49 80 40 71 40 60 
           C 40 49 49 40 60 40 
           C 71 40 80 49 80 60 
           C 80 64 79 67 77 70
           L 89 79
           C 92 73 94 67 94 60
           C 94 40 80 26 60 26 Z" 
        fill="url(#qelvix-grad)" />

  <!-- Q Accent / Security Sensor Node -->
  <circle cx="88" cy="88" r="8" fill="#00E5FF" filter="url(#glow)"/>
  <circle cx="88" cy="88" r="4" fill="#FFFFFF"/>

  <!-- Core Pulse Point -->
  <circle cx="60" cy="60" r="5" fill="#00E5FF" opacity="0.9"/>
</svg>
