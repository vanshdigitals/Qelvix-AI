[project]
name = "qelvix-backend"
version = "0.1.0"
description = "Qelvix API — FastAPI + LangGraph"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async — INV-10, blocking I/O in async def
    "S",    # flake8-bandit — 06 §18
    "T20",  # flake8-print — 06 §5, no print debugging
    "ANN",  # flake8-annotations — INV-14, no untyped def
    "RUF",
]
ignore = [
    "ANN401",  # typing.Any permitted only where explicitly justified
    "S101",    # assert is expected in tests; narrowed below
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN201", "S106"]  # S106: fixture values, never real secrets
"migrations/*" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
warn_unreachable = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "weasyprint.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "unit: isolated logic, no I/O",
    "tenancy: cross-tenant isolation assertions (08 §11.3)",
    "contract: OpenAPI snapshot and generated-type checks (gate G6)",
]
