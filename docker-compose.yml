# Local development infrastructure only (06 §2). Hosted Supabase and Upstash
# back staging and production; these services exist so a clone runs offline.
services:
  postgres:
    image: postgres:15-alpine
    container_name: qelvix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qelvix
      POSTGRES_PASSWORD: qelvix
      POSTGRES_DB: qelvix
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qelvix -d qelvix']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qelvix-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
